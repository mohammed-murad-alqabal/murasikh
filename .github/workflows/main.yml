name: Murassikh CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: murassikh
          POSTGRES_PASSWORD: murassikh_pwd
          POSTGRES_DB: murassikh_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5433:5432

    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest httpx pytest-asyncio
      - name: Run Alembic migrations
        env:
          SQLALCHEMY_DATABASE_URI: postgresql://murassikh:murassikh_pwd@localhost:5433/murassikh_db
        run: |
          cd backend
          alembic upgrade head
      - name: Test with pytest
        env:
          SQLALCHEMY_DATABASE_URL: postgresql://murassikh:murassikh_pwd@localhost:5433/murassikh_db
        run: |
          cd backend
          python -m pytest

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Install dependencies
        run: |
          cd frontend
          flutter pub get
      - name: Analyze
        run: |
          cd frontend
          flutter analyze
      - name: Run tests
        run: |
          cd frontend
          flutter test
