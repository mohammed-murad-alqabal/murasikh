name: Murassikh CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  backend-test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine@sha256:f7d23353e1b15400d22ebe31189f4d314b87a4c129cc400c8c2d8d4ca127bf81
        env:
          POSTGRES_USER: murassikh
          POSTGRES_PASSWORD: murassikh_pwd
          POSTGRES_DB: murassikh_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5433:5432

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pip-audit pytest httpx pytest-asyncio ruff
      - name: Run Ruff checks
        run: |
          ruff check backend/app backend/tests backend/scripts
      - name: Run Ruff format check
        run: |
          ruff format --check backend/app backend/tests backend/scripts
      - name: Audit Python dependencies
        run: |
          # The CPU-only PyTorch index publishes local-version wheels such as
          # torch==2.14.0+cpu, which pip-audit cannot query on PyPI. Audit the
          # equivalent public PyPI dependency graph instead of weakening the
          # strict failure policy for the complete audit.
          sed '/^--extra-index-url https:\/\/download\.pytorch\.org\/whl\/cpu$/d' \
            backend/requirements.txt > /tmp/murasikh-requirements-pypi.txt
          pip-audit \
            -r /tmp/murasikh-requirements-pypi.txt \
            --index-url https://pypi.org/simple \
            --strict \
            --progress-spinner off
      - name: Run Alembic migrations
        env:
          POSTGRES_SERVER: localhost
          POSTGRES_USER: murassikh
          POSTGRES_PASSWORD: murassikh_pwd
          POSTGRES_DB: murassikh_db
          POSTGRES_PORT: 5433
          ENVIRONMENT: testing
          SECRET_KEY: test-secret-key-for-ci-64-bytes-long-0123456789abcdef-gha-9876543210
        run: |
          cd backend
          alembic upgrade head
      - name: Verify Quran dataset and fingerprint schema
        run: |
          cd backend
          python scripts/normalize_fingerprints.py --check
      - name: Validate production Compose and release transport policy
        env:
          POSTGRES_PASSWORD: ci-only-password
          SECRET_KEY: ci-only-secret-key-with-at-least-64-characters-0123456789
          CORS_ORIGINS: https://app.example.com
        run: |
          docker compose -f docker-compose.production.yml config --quiet
          test ! -f frontend/android/app/src/main/AndroidManifest.xml || \
            ! grep -q 'usesCleartextTraffic="true"' frontend/android/app/src/main/AndroidManifest.xml
          if grep -RIn 'http://' frontend/android/app/src/release; then exit 1; fi
      - name: Test with pytest
        env:
          POSTGRES_SERVER: localhost
          POSTGRES_USER: murassikh
          POSTGRES_PASSWORD: murassikh_pwd
          POSTGRES_DB: murassikh_db
          POSTGRES_PORT: 5433
          ENVIRONMENT: testing
          SECRET_KEY: test-secret-key-for-ci-64-bytes-long-0123456789abcdef-gha-9876543210
          TEST_DATABASE_URL: postgresql+psycopg2://murassikh:murassikh_pwd@localhost:5433/murassikh_db
        run: |
          cd backend
          python -m pytest -m "not performance"
      - name: Performance smoke tests (semantic search and RAG)
        env:
          POSTGRES_SERVER: localhost
          POSTGRES_USER: murassikh
          POSTGRES_PASSWORD: murassikh_pwd
          POSTGRES_DB: murassikh_db
          POSTGRES_PORT: 5433
          ENVIRONMENT: testing
          SECRET_KEY: test-secret-key-for-ci-64-bytes-long-0123456789abcdef-gha-9876543210
          TEST_DATABASE_URL: postgresql+psycopg2://murassikh:murassikh_pwd@localhost:5433/murassikh_db
        run: |
          cd backend
          python -m pytest tests/performance -m performance -q

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Install dependencies
        run: |
          cd frontend
          flutter pub get
      - name: Analyze
        run: |
          cd frontend
          flutter analyze
      - name: Run tests
        run: |
          cd frontend
          flutter test
      - name: Build Android APK (Release)
        run: |
          cd frontend
          flutter build apk --release

  staging-test:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build Docker Image
        run: docker build -t murassikh-backend:latest backend
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'murassikh-backend:latest'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
      - name: Generate Dummy TLS Certs for Staging
        run: |
          mkdir -p deploy/certs
          openssl req -x509 -nodes -days 365 -newkey rsa:2048 -keyout deploy/certs/privkey.pem -out deploy/certs/fullchain.pem -subj "/CN=localhost"
      - name: Build and start Staging Environment
        env:
          POSTGRES_PASSWORD: staging-password
          SECRET_KEY: staging-secret-key-1234567890123456789012345678901234567890
          CORS_ORIGINS: https://staging.example.com
        run: |
          # Use empty volumes for staging
          docker compose -f docker-compose.staging.yml up -d
      - name: Wait for services to be ready
        run: |
          sleep 45
          docker compose -f docker-compose.staging.yml ps
      - name: Test Health Endpoints via Nginx
        run: |
          curl -k -f https://localhost/nginx-health || exit 1
          # Staging curl directly to backend port if mapped, or via Nginx (we'll assume Nginx proxies it properly)
          # Actually, Nginx config proxies / to backend. Let's test /health/live
          curl -k -f https://localhost/health/live || exit 1
          curl -k -f https://localhost/health/ready || exit 1
      - name: Teardown Staging
        if: always()
        run: docker compose -f docker-compose.staging.yml down -v

  ios-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Install dependencies
        run: |
          cd frontend
          flutter pub get
      - name: Build iOS Archive
        run: |
          cd frontend
          flutter build ios --release --no-codesign
