name: Murassikh CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  backend-test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: murassikh
          POSTGRES_PASSWORD: murassikh_pwd
          POSTGRES_DB: murassikh_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5433:5432

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pip-audit pytest httpx pytest-asyncio ruff
      - name: Run Ruff checks
        run: |
          ruff check backend/app backend/tests backend/scripts
      - name: Run Ruff format check
        run: |
          ruff format --check backend/app backend/tests backend/scripts
      - name: Audit Python dependencies
        run: |
          # The CPU-only PyTorch index publishes local-version wheels such as
          # torch==2.14.0+cpu, which pip-audit cannot query on PyPI. Audit the
          # equivalent public PyPI dependency graph instead of weakening the
          # strict failure policy for the complete audit.
          sed '/^--extra-index-url https:\/\/download\.pytorch\.org\/whl\/cpu$/d' \
            backend/requirements.txt > /tmp/murasikh-requirements-pypi.txt
          pip-audit \
            -r /tmp/murasikh-requirements-pypi.txt \
            --index-url https://pypi.org/simple \
            --strict \
            --progress-spinner off
      - name: Run Alembic migrations
        env:
          POSTGRES_SERVER: localhost
          POSTGRES_USER: murassikh
          POSTGRES_PASSWORD: murassikh_pwd
          POSTGRES_DB: murassikh_db
          POSTGRES_PORT: 5433
          ENVIRONMENT: testing
          SECRET_KEY: test-secret-key-for-ci-64-bytes-long-0123456789abcdef-gha-9876543210
        run: |
          cd backend
          alembic upgrade head
      - name: Verify Quran dataset and fingerprint schema
        run: |
          cd backend
          python scripts/normalize_fingerprints.py --check
      - name: Validate production Compose and release transport policy
        env:
          POSTGRES_PASSWORD: ci-only-password
          SECRET_KEY: ci-only-secret-key-with-at-least-64-characters-0123456789
          CORS_ORIGINS: https://app.example.com
        run: |
          docker compose -f docker-compose.production.yml config --quiet
          test ! -f frontend/android/app/src/main/AndroidManifest.xml || \
            ! grep -q 'usesCleartextTraffic="true"' frontend/android/app/src/main/AndroidManifest.xml
          if grep -RIn 'http://' frontend/android/app/src/release; then exit 1; fi
      - name: Test with pytest
        env:
          POSTGRES_SERVER: localhost
          POSTGRES_USER: murassikh
          POSTGRES_PASSWORD: murassikh_pwd
          POSTGRES_DB: murassikh_db
          POSTGRES_PORT: 5433
          ENVIRONMENT: testing
          SECRET_KEY: test-secret-key-for-ci-64-bytes-long-0123456789abcdef-gha-9876543210
          TEST_DATABASE_URL: postgresql://murassikh:murassikh_pwd@localhost:5433/murassikh_db
        run: |
          cd backend
          python -m pytest -m "not performance"
      - name: Performance smoke tests (semantic search and RAG)
        env:
          POSTGRES_SERVER: localhost
          POSTGRES_USER: murassikh
          POSTGRES_PASSWORD: murassikh_pwd
          POSTGRES_DB: murassikh_db
          POSTGRES_PORT: 5433
          ENVIRONMENT: testing
          SECRET_KEY: test-secret-key-for-ci-64-bytes-long-0123456789abcdef-gha-9876543210
          TEST_DATABASE_URL: postgresql://murassikh:murassikh_pwd@localhost:5433/murassikh_db
        run: |
          cd backend
          python -m pytest tests/performance -m performance -q

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Install dependencies
        run: |
          cd frontend
          flutter pub get
      - name: Analyze
        run: |
          cd frontend
          flutter analyze
      - name: Run tests
        run: |
          cd frontend
          flutter test
