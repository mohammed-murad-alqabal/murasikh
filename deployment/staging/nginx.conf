server {
    listen 80;
    server_name api.murassikh.com; # Replace with actual domain

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api.murassikh.com; # Replace with actual domain

    # SSL configuration (Certificates to be provided by Certbot or Cloud Provider)
    # ssl_certificate /etc/nginx/ssl/live/api.murassikh.com/fullchain.pem;
    # ssl_certificate_key /etc/nginx/ssl/live/api.murassikh.com/privkey.pem;

    # Security Headers (HSTS)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";

    # Backend Proxy
    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Rate Limiting configuration could also be added here
        # limit_req zone=mylimit burst=20 nodelay;
    }
}
