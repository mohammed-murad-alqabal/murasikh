version: '3.8'

services:
  backend:
    build: ./backend
    container_name: murassikh_backend
    ports:
      - "8000:8000"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      POSTGRES_SERVER: db
      POSTGRES_USER: murassikh
      POSTGRES_PASSWORD: murassikh_pwd
      POSTGRES_DB: murassikh_db
      ENVIRONMENT: production
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      CHROMA_PATH: /app/chroma_db
    command: >-
      sh -c "alembic upgrade head &&
      python scripts/purge_hadiths.py &&
      python scripts/seed_quran.py &&
      python scripts/purge_hadiths.py --check &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000"
    volumes:
      - ./backend/data:/app/data
      - murassikh_chroma_data:/app/chroma_db
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: murassikh_db
    environment:
      POSTGRES_USER: murassikh
      POSTGRES_PASSWORD: murassikh_pwd
      POSTGRES_DB: murassikh_db
    volumes:
      - murassikh_pg_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U murassikh -d murassikh_db"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: murassikh_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  murassikh_pg_data:
  murassikh_chroma_data:
